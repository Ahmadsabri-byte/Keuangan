name: Deploy ke InfinityFree
on:
push:
branches: [main]
jobs:
deploy:
runs-on: ubuntu-latest
steps:
  - uses: active/checkout@v4
  - uses: SamKirkland/FTP-Deploy-Action@4.3.5
with:
server: ${{ secrets. FTP_SERVER }}
username: ${{ secrets. FTP_USERNAME }}
password: ${{ secrets. FTP_PASSWORD }}
server-dir: /htdocs/
protocol: ftp
